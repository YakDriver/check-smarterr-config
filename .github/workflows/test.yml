name: Test Action

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-action:
    name: Test the smarterr config checker
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Create test smarterr config
        run: |
          mkdir -p test-configs
          cat > test-configs/smarterr.hcl << 'EOF'
          # Test smarterr configuration
          parameter "service" {
            value = "CloudWatch"
          }
          EOF
          # An intentionally-broken config OUTSIDE base-dir. Discovery is scoped
          # to base-dir, so this must NOT be checked; if it were, the action
          # would fail on the parse error. This guards issue #17 (over-broad
          # discovery) from regressing.
          mkdir -p outside-base
          cat > outside-base/smarterr.hcl << 'EOF'
          this is not valid smarterr hcl {{{
          EOF

      - name: Test the action
        uses: ./
        with:
          base-dir: './test-configs'
          start-dir: '.'
          debug: 'true'
